name: Build & Release Archive App (Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux Binary
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pillow pyinstaller

      - name: Build Executable
        shell: bash
        run: |
          # Budujemy w trybie --onedir (zoptymalizowany folder dla Linuxa)
          python -m PyInstaller --noconfirm --onedir --windowed \
            --add-data "archive.png:." \
            --name "archive-app-linux" \
            archive-app.py

          # Przygotowujemy strukturę paczki linux-package
          mkdir -p linux-package
          cp -r dist/archive-app-linux linux-package/
          cp archive.png linux-package/

          # Generowanie pliku .desktop (wzorowane na Twoim PKGBUILD)
          echo "[Desktop Entry]" > linux-package/ArchiveApp.desktop
          echo "Name=Home Archive" >> linux-package/ArchiveApp.desktop
          echo "Name[pl]=Domowe Archiwum" >> linux-package/ArchiveApp.desktop
          echo "Comment=Management of home documents" >> linux-package/ArchiveApp.desktop
          echo "Comment[pl]=Zarządzanie Domowymi Dokumentami" >> linux-package/ArchiveApp.desktop
          echo "Exec=archive-app-linux/archive-app-linux" >> linux-package/ArchiveApp.desktop
          echo "Icon=archive" >> linux-package/ArchiveApp.desktop
          echo "Terminal=false" >> linux-package/ArchiveApp.desktop
          echo "Type=Application" >> linux-package/ArchiveApp.desktop
          echo "Categories=Office;Utility;" >> linux-package/ArchiveApp.desktop
          echo "StartupWMClass=archive-app-linux" >> linux-package/ArchiveApp.desktop
          echo "StartupNotify=true" >> linux-package/ArchiveApp.desktop

          # Pakujemy całość do formatu .tar.gz
          tar -czf dist/ArchiveApp_linux.tar.gz linux-package

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ArchiveApp_linux.tar.gz
          body: |
            ## Wersja ${{ github.ref_name }}
            - Automatyczna kompilacja kompletnej paczki dla systemów Linux.
            - Zawiera: `ArchiveApp_linux.tar.gz` (folder aplikacji wraz ze skrótem `.desktop`).
          draft: false
          prerelease: false
