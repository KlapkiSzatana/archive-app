name: Build & Release Archive App (Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux Binary
    runs-on: ubuntu-22.04  # Możesz zmienić na ubuntu-20.04 dla lepszej kompatybilności

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pillow pyinstaller

      - name: Build Executable
        run: |
          # Budujemy jeden plik (--onefile), bez konsoli (--windowed)
          # Dodajemy logic.py (jeśli jest importowany) oraz ikonę
          python -m PyInstaller --noconfirm --onefile --windowed \
            --add-data "archive.png:." \
            --name "archive-app-linux" \
            archive-app.py

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/archive-app-linux
          body: |
            ## Wersja ${{ github.ref_name }}
            - Automatyczna kompilacja binarki dla systemów Linux.
            - Zawiera: `archive-app-linux` (standalone).
          draft: false
          prerelease: false
